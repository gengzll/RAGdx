[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdx"
version = "0.9.0"
description = "End-to-end RAG optimization experiment: Bayesian RAG-config search + DSPy prompt tuning, evaluated with Ragas/DeepEval, with a Streamlit studio (upload PDF/ground-truth → live progress → report)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ragdx contributors" }]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "evaluation",
  "diagnosis",
  "optimization",
  "bayesian-optimization",
  "llm",
  "ragas",
  "ragchecker",
  "dspy",
  "autorag",
  "langchain",
  "llamaindex",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyyaml>=6.0,<7",
  "plotly>=5.22,<7",
  "streamlit>=1.35,<2",
  # typer 0.16+ is the minimum that runs cleanly with click 8.2+:
  # earlier 0.12-0.15 trips on either PEP 604 introspection (bool
  # secondary flags) or click's ``make_metavar`` signature change.
  "typer>=0.16,<1",
  "rich>=13.7,<15",
  "scikit-learn>=1.5,<2",
  "networkx>=3.2,<4",
]

[project.optional-dependencies]
openai = ["openai>=1.30,<2"]
anthropic = ["anthropic>=0.34,<1"]
azure = ["openai>=1.30,<2"]
ollama = ["httpx>=0.27,<1"]
langchain = [
  "langchain>=0.3,<2",
  "langchain-core>=0.3,<2",
  "langchain-community>=0.3,<1",
  # Pulled in by ``ragdx.experiments`` and the demo scripts when the user
  # opts into the end-to-end Bayesian search path. Keeping them in the
  # langchain extra avoids the partial-install footgun where ``run_experiment``
  # fails on a missing ``langchain_huggingface`` / ``langchain_openai``.
  "langchain-huggingface>=0.1,<1",
  "langchain-openai>=0.2,<1",
]
llamaindex = ["llama-index-core>=0.12,<1"]
ragas = ["ragas>=0.3,<0.4"]
deepeval = ["deepeval>=2.0,<4", "langchain-openai>=0.2,<1"]
ragchecker = ["ragchecker>=0.1,<0.2"]
dspy = ["dspy>=2.5.6,<4"]
# End-to-end ``ragdx experiment`` pipeline + Streamlit studio: PDF loader
# + Excel/CSV ground-truth + HF datasets + question synthesis + ragas eval
# + DSPy A/B. Composes the langchain / ragas / dspy extras with the
# loader-specific deps. This is the recommended install for ragdx.
experiment = [
  "pypdf>=4.0,<7",
  "datasets>=2.18,<4",
  "openpyxl>=3.1,<4",
  "langchain>=0.3,<2",
  "langchain-core>=0.3,<2",
  "langchain-community>=0.3,<1",
  "langchain-huggingface>=0.1,<1",
  "langchain-openai>=0.2,<1",
  "ragas>=0.3,<0.4",
  "dspy>=2.5.6,<4",
  "sentence-transformers>=2.7,<6",
  "faiss-cpu>=1.7,<2",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
]
all = [
  "openai>=1.30,<2",
  "anthropic>=0.34,<1",
  "httpx>=0.27,<1",
  "ragas>=0.3,<0.4",
  "ragchecker>=0.1,<0.2",
  "dspy>=2.5.6,<4",
  "langchain>=0.3,<2",
  "langchain-core>=0.3,<2",
  "langchain-community>=0.3,<1",
  "langchain-huggingface>=0.1,<1",
  "langchain-openai>=0.2,<1",
  "llama-index-core>=0.12,<1",
  "pypdf>=4.0,<7",
  "datasets>=2.18,<4",
  "openpyxl>=3.1,<4",
  "sentence-transformers>=2.7,<6",
  "faiss-cpu>=1.7,<2",
]

[project.urls]
Homepage = "https://github.com/ragdx/ragdx"
Documentation = "https://github.com/ragdx/ragdx/tree/main/docs"
Issues = "https://github.com/ragdx/ragdx/issues"
Source = "https://github.com/ragdx/ragdx"

[project.scripts]
ragdx = "ragdx.cli:main"
ragdx-ui = "ragdx.ui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragdx = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:ax.*",
  "ignore::DeprecationWarning:botorch.*",
]

[tool.coverage.run]
branch = true
source = ["ragdx"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF"]
ignore = [
  "E501",  # line length handled by formatter
  "B008",  # function call as default arg (typer relies on this)
  "RUF012",  # mutable class attrs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# ``src/ragdx/__init__.py`` deliberately calls
# ``_install_vertexai_shims()`` *before* the public re-export imports
# so the langchain-community ``vertexai`` stub is in place by the
# time ragas tries to import it. Suppress E402 here to express the
# intent ("imports must follow this call").
"src/ragdx/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["src/ragdx"]
