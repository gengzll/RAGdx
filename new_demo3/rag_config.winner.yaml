name: esg-analyst-mipro-winner
runtime: langchain
corpus:
  kind: pdf
  path: e0522-asmptesgreport.pdf
chunker:
  strategy: recursive
  chunk_size: 512
  chunk_overlap: 50
embedder:
  kind: huggingface
  model_name: sentence-transformers/all-MiniLM-L6-v2
  normalize: true
retriever:
  vectorstore: faiss
  search_type: similarity
  top_k: 3
  reranker: none
generator:
  provider: litellm
  model: openai/glm-4-flash
  api_base: https://open.bigmodel.cn/api/paas/v4
  api_key: null
  # MIPROv2's winning candidate (Instruction 3) from the 2026-06-02
  # medium + ragas run. Trial 10 / 18 scored 249.7 vs the baseline
  # (Instruction 0) score 240.97 -- the FIRST time MIPROv2 was able
  # to discriminate between candidates because the metric switched
  # from llm_judge (saturated at 100) to ragas composite.
  system_instruction: |
    Prompt the Language Model to act as an ESG sustainability analyst reviewing ASMPT's 2024 report. The task is to analyze a given question about the report's content and provide a detailed reasoning process that leads to the answer. If the answer is not found in the report, the response should be "Not in report". Ensure that the reasoning process is clear and step-by-step, and when quoting from the report, use exact wording. The focus should be on understanding the context provided and deriving conclusions based on that context.
  temperature: 0.01
  max_tokens: 350
  timeout: 60
judge:
  model: null
  api_base: null
  api_key: null
  llm_max_concurrent: 2
  llm_max_retries: 5
