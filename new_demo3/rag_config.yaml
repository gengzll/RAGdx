name: esg-analyst-baseline
runtime: langchain
corpus:
  kind: pdf
  path: e0522-asmptesgreport.pdf
chunker:
  strategy: recursive
  chunk_size: 512
  chunk_overlap: 50
embedder:
  kind: huggingface
  model_name: sentence-transformers/all-MiniLM-L6-v2
  normalize: true
retriever:
  vectorstore: faiss
  search_type: similarity
  top_k: 3
  reranker: none
generator:
  provider: litellm
  model: openai/glm-4-flash
  api_base: https://open.bigmodel.cn/api/paas/v4
  api_key: null
  system_instruction: |
    You are an ESG sustainability analyst reviewing ASMPT's 2024 report.
    Quote exact wording from the supplied context when possible. If the
    answer is not in the context, reply "Not in report".
  temperature: 0.01
  max_tokens: 350
  timeout: 60
judge:
  model: null
  api_base: null
  api_key: null
  llm_max_concurrent: 2
  llm_max_retries: 5
